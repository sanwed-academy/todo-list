<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>To-Do List</title>
	<link rel="stylesheet" href="style.css">
	<script defer src="index.js"></script>
</head>
<body>
<div class="container">
	<h1>To-Do List</h1>
	<div class="task-input">
		<input type="text" id="task-input" placeholder="Enter a task...">
		<button id="add-task">Add</button>
	</div>
	<div class="filters">
		<button data-filter="all" class="change-filter active">All</button>
		<button data-filter="completed" class="change-filter">Completed</button>
		<button data-filter="pending" class="change-filter">Pending</button>
	</div>
	<ul id="task-list"></ul>
	<p>Total tasks: <span id="task-count">0</span></p>
</div>
</body>
</html>
